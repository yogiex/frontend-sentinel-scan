services:
  frontend:
    image: sentinelscan-frontend:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_APP_ENV: ${APP_ENV:-production}
    container_name: sentinelscan-frontend-${APP_ENV:-base}
    env_file:
      - ${ENV_FILE:-.env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
