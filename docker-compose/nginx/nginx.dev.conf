# Development Nginx - Reverse Proxy to Vite Dev Server

# Extract date from timestamp for log rotation
map $time_iso8601 $logdate {
    ~^(?<ymd>\d{4}-\d{2}-\d{2}) $ymd;
    default 'unknown';
}

# Log format with request details
log_format dev_log '$time_local | $remote_addr | $request_method $request_uri | '
                   '$status | $body_bytes_sent | $request_time | "$http_referer" | '
                   '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # Date-based log files
    access_log /var/log/nginx/$logdate-access.log dev_log;
    error_log /var/log/nginx/$logdate-error.log warn;

    # Reverse proxy to Vite dev server
    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket support for HMR
    location /ws {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Disable caching for development
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}
