# Production Nginx - Hardened security configuration

# Extract date from timestamp for log rotation
map $time_iso8601 $logdate {
    ~^(?<ymd>\d{4}-\d{2}-\d{2}) $ymd;
    default 'unknown';
}

# Detailed log format with security fields
log_format prod_log '$time_local | $remote_addr | $request_method $request_uri | '
                    '$status | $body_bytes_sent | $request_time | "$http_referer" | '
                    '"$http_user_agent" | $http_x_forwarded_for';

server {
    listen 80;
    server_name sentinelscan.com www.sentinelscan.com;

    # Date-based log files for HTTP redirect
    access_log /var/log/nginx/$logdate-access.log prod_log;
    error_log /var/log/nginx/$logdate-error.log warn;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sentinelscan.com www.sentinelscan.com;

    root /usr/share/nginx/html;
    index index.html;

    # Date-based log files for HTTPS
    access_log /var/log/nginx/$logdate-access.log prod_log;
    error_log /var/log/nginx/$logdate-error.log warn;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS (63072000 seconds = 2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.sentinelscan.com wss://api.sentinelscan.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req zone=api_limit burst=20 nodelay;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hardened security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;  # Rely on CSP instead
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Hide nginx version
    server_tokens off;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common attack paths
    location ~* /(wp-admin|wp-login|xmlrpc|\.env|\.git|\.svn|\.htaccess) {
        deny all;
        return 404;
    }

    # Limit request body size
    client_max_body_size 1m;

    # Error pages
    error_page 404 /index.html;
}
