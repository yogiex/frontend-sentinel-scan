# Staging Nginx - Production-like with moderate security

# Extract date from timestamp for log rotation
map $time_iso8601 $logdate {
    ~^(?<ymd>\d{4}-\d{2}-\d{2}) $ymd;
    default 'unknown';
}

# Detailed log format
log_format staging_log '$time_local | $remote_addr | $request_method $request_uri | '
                       '$status | $body_bytes_sent | $request_time | "$http_referer" | '
                       '"$http_user_agent"';

server {
    listen 80;
    server_name staging.sentinelscan.com;

    root /usr/share/nginx/html;
    index index.html;

    # Date-based log files
    access_log /var/log/nginx/$logdate-access.log staging_log;
    error_log /var/log/nginx/$logdate-error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
}
